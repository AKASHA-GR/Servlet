<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Page</title>
</head>
<body>
<h1>Event Page</h1>
<form action="/event" method="post">
    Event Name: <input type="text" name="name" placeholder="Enter Event Name">
    Organizer: <input type="text" name="organizer" placeholder="Enter Organizer Name">
    Event Date: <input type="date" name="date">
    Venue :<input type="text" name="venue" placeholder="Enter Venue">
    Capacity: <input type="number" name="capacity">
    Registration Fee: <input type="number" name="fee">
    <input type="date" name="date">
    <input type="submit" value="Register">
</form>
</body>
</html>
